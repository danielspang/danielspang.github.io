<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Location Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GPS Tracker" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a84ff'/><circle cx='50' cy='50' r='22' fill='none' stroke='white' stroke-width='8'/><circle cx='50' cy='50' r='8' fill='white'/></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --bg: #0f1115; --card: #181b21; --text: #f3f4f6; --muted: #9ca3af; --accent: #0a84ff; --danger: #ff453a; --success: #32d74b; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px; display: flex; flex-direction: column; min-height: 100vh; }
    header { padding: 16px 0 12px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 20px; margin: 0; font-weight: 700; }
    .badge { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.08); color: var(--muted); font-weight: 600; }
    .badge.active { background: rgba(50, 215, 75, 0.15); color: var(--success); }
    .badge.error { background: rgba(255, 69, 58, 0.15); color: var(--danger); }
    #map { height: 260px; width: 100%; border-radius: 16px; background: #1c1f26; margin-bottom: 16px; z-index: 1; }
    .error-box { display: none; background: rgba(255, 69, 58, 0.15); border: 1px solid rgba(255, 69, 58, 0.4); color: #ff8a84; padding: 12px; border-radius: 12px; font-size: 13px; margin-bottom: 16px; line-height: 1.4; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .card { background: var(--card); padding: 14px; border-radius: 14px; }
    .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 4px; }
    .value { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .card.full { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; }
    button { width: 100%; padding: 15px; border-radius: 14px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; background: var(--card); color: var(--text); border: 1px solid rgba(255,255,255,0.1); transition: 0.2s; }
    button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 12px; line-height: 1.4; }
  </style>
</head>
<body>
  <header>
    <h1>GPS Tracker</h1>
    <span id="status" class="badge">Initializing...</span>
  </header>

  <div id="errorBox" class="error-box"></div>
  <div id="map"></div>

  <div class="grid">
    <div class="card"><div class="label">Latitude</div><div id="lat" class="value">—</div></div>
    <div class="card"><div class="label">Longitude</div><div id="lng" class="value">—</div></div>
    <div class="card"><div class="label">Accuracy</div><div id="acc" class="value">—</div></div>
    <div class="card"><div class="label">Speed</div><div id="spd" class="value">—</div></div>
    <div class="card"><div class="label">Altitude</div><div id="alt" class="value">—</div></div>
    <div class="card"><div class="label">Heading</div><div id="hdg" class="value">—</div></div>
    <div class="card full">
      <div class="label" style="margin:0">Last Updated</div>
      <div id="time" class="value" style="font-size:14px">—</div>
    </div>
  </div>

  <button id="audioBtn">Enable Background Audio Keep-Alive</button>
  <p class="note">Plays a silent 20Hz tone to prevent iOS from suspending Safari in the background. Drains battery faster.</p>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([0, 0], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
    let marker = null, circle = null, firstFix = true;

    const statusEl = document.getElementById('status');
    const errorBox = document.getElementById('errorBox');

    function showError(msg) {
      statusEl.textContent = 'Error';
      statusEl.className = 'badge error';
      errorBox.style.display = 'block';
      errorBox.textContent = msg;
    }

    if (!('geolocation' in navigator)) {
      showError('Geolocation is not supported by this browser.');
    } else {
      navigator.geolocation.watchPosition(
        (pos) => {
          errorBox.style.display = 'none';
          statusEl.textContent = 'Live GPS';
          statusEl.className = 'badge active';

          const { latitude, longitude, accuracy, speed, altitude, heading } = pos.coords;
          document.getElementById('lat').textContent = latitude.toFixed(6);
          document.getElementById('lng').textContent = longitude.toFixed(6);
          document.getElementById('acc').textContent = `±${Math.round(accuracy)} m`;
          document.getElementById('spd').textContent = speed !== null ? `${(speed * 3.6).toFixed(1)} km/h` : '0.0 km/h';
          document.getElementById('alt').textContent = altitude !== null ? `${Math.round(altitude)} m` : '—';
          document.getElementById('hdg').textContent = heading !== null ? `${Math.round(heading)}°` : '—';
          document.getElementById('time').textContent = new Date(pos.timestamp).toLocaleTimeString();

          const latLng = [latitude, longitude];
          if (!marker) {
            marker = L.circleMarker(latLng, { radius: 8, fillColor: '#0a84ff', color: '#fff', weight: 2, fillOpacity: 1 }).addTo(map);
            circle = L.circle(latLng, { radius: accuracy, color: '#0a84ff', fillColor: '#0a84ff', fillOpacity: 0.15, weight: 1 }).addTo(map);
          } else {
            marker.setLatLng(latLng);
            circle.setLatLng(latLng).setRadius(accuracy);
          }
          if (firstFix) { map.setView(latLng, 16); firstFix = false; }
        },
        (err) => {
          const messages = {
            1: 'Permission denied. Open Settings > Privacy & Security > Location Services > Safari Websites and allow location.',
            2: 'Position unavailable. Check your GPS or network signal.',
            3: 'Location request timed out. Retrying...'
          };
          showError(messages[err.code] || err.message);
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
      );
    }

    // Silent Audio Keep-Alive
    let audioCtx = null, isPlaying = false;
    const audioBtn = document.getElementById('audioBtn');
    audioBtn.addEventListener('click', () => {
      if (!isPlaying) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 20;
        gain.gain.value = 0.001;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        isPlaying = true;
        audioBtn.textContent = 'Stop Background Keep-Alive';
        audioBtn.classList.add('active');
      } else {
        if (audioCtx) audioCtx.close();
        isPlaying = false;
        audioBtn.textContent = 'Enable Background Audio Keep-Alive';
        audioBtn.classList.remove('active');
      }
    });
  </script>
</body>
</html>
